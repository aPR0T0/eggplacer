[project]
name = "pcb-component-placer"
version = "0.2.0"
description = "PCB component placement algorithms for KiCad boards behind one interface (EGGPlacer, user-placed)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "numba",
    "shapely>=2.0",
    "matplotlib",
    "torch>=2.2",
    "torch_geometric",
    "pyyaml>=6",
]

[project.optional-dependencies]
# regenerate docs figures
docs = ["pillow", "pygments"]

[project.scripts]
pcb-placer = "pcb_component_placer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pcb_component_placer", "eggpcb"]

# CPU torch wheels by default (a CUDA build is only needed to train; see GUIDE.md)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["pytest>=8"]
